# Spring Application
spring.application.name=task-manager
spring.profiles.active=dev

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/taskmanager
spring.datasource.username=postgres
spring.datasource.password=sayanpappu
spring.datasource.driver-class-name=org.postgresql.Driver

# loggin configuration
spring.logging-datasource.url=jdbc:postgresql://postgres:5432/taskmanager_logs
spring.logging-datasource.username=postgres
spring.logging-datasource.password=sayanpappu
spring.logging-datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Flyway
spring.flyway.enabled=false
#spring.flyway.locations=classpath:db/migration
#spring.flyway.baseline-on-migrate=true
#spring.flyway.clean-disabled=false

# Flyway Debug
#logging.level.org.flywaydb=DEBUG
#logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# Redis & Caching - disabled until Redis is installed
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# Custom App Security & JWT
app.jwt.secret=${JWT_SECRET:change-this-to-a-very-long-secret-key-in-production-256-bits}
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000
app.security.max-login-attempts=5
app.security.lockout-duration-minutes=15

# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# Actuator Management
management.endpoints.web.exposure.include=health,info